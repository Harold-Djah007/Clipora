name: threadvault
description: Clipora 2.0 premium smart media saver with one-tap command UX, field capture, optional resolver boost, carousel saving up to 20 items, and commercial-grade dark UI.
publish_to: 'none'
version: 2.0.0+40

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  intl: ^0.19.0
  crypto: ^3.0.6
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/clipora_logo.png
    - assets/brand/clipora_mark.png
    - assets/brand/clipora_wordmark.png
