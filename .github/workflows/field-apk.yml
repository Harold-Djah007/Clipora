name: Build field APK

on:
  push:
    branches:
      - feature/universal-resolver-foundation
    paths:
      - .github/workflows/field-apk.yml
      - mobile/**
  workflow_dispatch:
    inputs:
      resolver_url:
        description: Public HTTPS Clipora resolver URL (for example, https://clipora-resolver.onrender.com)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-field-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      INPUT_RESOLVER_URL: ${{ inputs.resolver_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate hosted resolver URL
        id: configure
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          raw = os.environ.get("INPUT_RESOLVER_URL", "").strip().rstrip("/")
          if not raw:
              lines = Path("field_resolver_url.txt").read_text(encoding="utf-8").splitlines()
              raw = next((line.strip().rstrip("/") for line in lines if line.strip() and not line.lstrip().startswith("#")), "")
          if not raw:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("enabled=false\n")
              print("No hosted resolver URL configured yet; field APK build skipped.")
              raise SystemExit(0)

          parsed = urlparse(raw)
          blocked = {"", "localhost", "127.0.0.1", "10.0.2.2"}
          if parsed.scheme != "https" or parsed.hostname in blocked:
              raise SystemExit("resolver_url must be a public HTTPS URL")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CLIPORA_RESOLVER_URL={raw}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("enabled=true\n")
          PY
      - uses: subosito/flutter-action@v2
        if: steps.configure.outputs.enabled == 'true'
        with:
          channel: stable
          flutter-version: '3.47.2'
      - name: Install dependencies
        if: steps.configure.outputs.enabled == 'true'
        run: flutter pub get
      - name: Run tests
        if: steps.configure.outputs.enabled == 'true'
        run: flutter test
      - name: Build field APK
        if: steps.configure.outputs.enabled == 'true'
        run: flutter build apk --release --no-pub --dart-define=CLIPORA_RESOLVER_URL="$CLIPORA_RESOLVER_URL"
      - name: Upload installable APK
        if: steps.configure.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clipora-field-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
